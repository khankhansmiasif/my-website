<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCM Mastery — Learn Medical &amp; Dental Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,680;1,9..144,500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0e1a; --panel:#111728; --panel2:#161d33; --line:rgba(255,255,255,.09);
  --paper:#f4efe4; --gold:#e3b23c; --gold2:#f4d478; --blue:#5b8cff; --blue2:#2f58d9;
  --ash:#8b96b3; --mist:#c7cee3; --good:#4fbf8b;
  --s:1rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1100px 620px at 82% -8%, rgba(91,140,255,.16), transparent 60%),
    radial-gradient(900px 500px at 10% 0%, rgba(227,178,60,.10), transparent 55%),
    var(--ink);
  color:var(--mist); font-family:'Outfit',system-ui,sans-serif; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
::selection{background:rgba(227,178,60,.3);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
h1,h2,h3{font-family:'Fraunces',serif;color:#f6f3ec;font-weight:560;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}

/* ---------- NAV ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:50;padding:22px 0;transition:background .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
header.on{background:rgba(10,14,26,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
nav{display:flex;align-items:center;justify-content:space-between}
